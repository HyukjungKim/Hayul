<title>하율이의 옷장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one-screen phone app — stage (photo + layered clothes) on top, category chips + cover-flow below, tab bar at the bottom. */
:root {
  --milk: #FFFBF5;        /* page ground: strawberry-milk cream */
  --card: #FFFFFF;
  --ink: #3A2E3F;         /* warm plum ink */
  --sub: #8D8197;
  --line: #F0E5EA;
  --sky: #CDEAF8;         /* pajama blue */
  --sky-deep: #6BB8E0;
  --berry: #F2545B;       /* strawberry red */
  --berry-soft: #FFE1E3;
  --berry-ink: #C93840;
  --butter: #FFE58F;      /* cuff yellow */
  --wood: #FFF1E2;
  --wood-line: #E8CDAA;
  --shadow: 0 6px 20px rgba(88, 52, 74, .10);
  --font-cute: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--milk); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 2px; }
input[type=text] { -webkit-user-select: text; user-select: text; }
h1, h2, h3 { margin: 0; font-family: var(--font-cute); font-weight: 400; text-wrap: balance; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 2px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand h1 { font-size: 21px; letter-spacing: -.4px; white-space: nowrap; }
.brand h1 b { color: var(--berry); font-weight: 400; }
.head-tools, .try-tools { display: flex; align-items: center; gap: 6px; }
.try-tools[hidden] { display: none !important; }
.icon-btn { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.off { opacity: .5; }
.icon-btn.playing svg { animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px) rotate(-6deg); } }

main { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 8px 100px; }

/* stage */
.stage-wrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 6px; }
.stage {
  position: relative; isolation: isolate; border-radius: 28px; overflow: hidden; touch-action: none;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.7) 0 6px, transparent 7px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.55) 0 4px, transparent 5px) 0 0 / 46px 46px,
    linear-gradient(180deg, #D7F0FB 0%, var(--sky) 70%, #BFE1F2 100%);
  box-shadow: var(--shadow), inset 0 0 0 3px rgba(255,255,255,.7);
}
.stage.photo { background: #EDE6EA; }
.stage .floor { position: absolute; left: 22%; right: 22%; bottom: 2.5%; height: 4.5%; border-radius: 50%; background: rgba(60, 120, 160, .16); }
.stage.photo .floor { display: none; }
.layer { position: absolute; pointer-events: none; transform-origin: 50% 50%; -webkit-user-drag: none; }
.layer.base { inset: 0; width: 100%; height: 100%; object-fit: fill; }
.layer.face { object-fit: cover; -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); }
.layer.face.cut { -webkit-mask-image: none; mask-image: none; filter: drop-shadow(0 2px 3px rgba(60, 40, 50, .18)); }
.layer.active { filter: drop-shadow(0 0 0 transparent); }
.stage.adjusting .layer.active { filter: drop-shadow(0 0 6px rgba(242, 84, 91, .65)); }
.stage-tools { display: flex; gap: 8px; }
.seg { display: flex; background: #fff; border-radius: 18px; padding: 3px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.seg button { height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; white-space: nowrap; font-weight: 700; color: var(--sub); }
.seg button.on { background: var(--berry); color: #fff; }
.round { width: 36px; height: 36px; border-radius: 18px; flex: none; background: #fff; box-shadow: var(--shadow); display: grid; place-items: center; overflow: hidden; }
.round img { width: 100%; height: 100%; object-fit: cover; }
.round svg { width: 19px; height: 19px; }
.ai-btn { flex: none; align-self: center; margin-top: 10px; display: flex; align-items: center; gap: 5px; height: 38px; padding: 0 16px; border-radius: 19px; background: var(--berry); color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; box-shadow: 0 6px 16px rgba(242, 84, 91, .35); }
.ai-btn svg { width: 17px; height: 17px; }
.ai-btn:active { transform: scale(.96); }
.steps { display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.steps div { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--sub); }
.steps div::before { content: ""; width: 10px; height: 10px; border-radius: 5px; background: #E9E1E7; flex: none; }
.steps div.doing { color: var(--ink); }
.steps div.doing::before { background: var(--butter); animation: pulse 1s ease-in-out infinite; }
.steps div.done::before { background: var(--berry); }
@keyframes pulse { 50% { transform: scale(1.5); } }
.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.looks button { aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden; background: #eee; box-shadow: var(--shadow); }
.looks img { width: 100%; height: 100%; object-fit: cover; }
.field.key { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.stage-note { flex: none; margin-top: 8px; align-self: center; max-width: 100%; background: var(--berry-soft); color: var(--berry-ink); font-size: 13px; font-weight: 600; line-height: 1.45; padding: 7px 14px; border-radius: 14px; text-align: center; }
.stage-note button { color: var(--berry); font-weight: 700; text-decoration: underline; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px 0 5px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink); transition: background .15s, color .15s; }
.chip .th { width: 30px; height: 30px; border-radius: 15px; background: var(--milk) center / 78% no-repeat; border: 1.5px dashed #E4D6DE; }
.chip .th.has { border-style: solid; border-color: var(--line); background-color: #fff; }
.chip.on { background: var(--berry); border-color: var(--berry); color: #fff; }
.chip.on .th { border-color: rgba(255,255,255,.7); }

/* cover flow */
.flow-head { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; flex: none; }
.flow-head b { font-family: var(--font-cute); font-weight: 400; font-size: 18px; }
.flow-head { align-items: center; gap: 8px; }
.flow-actions { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mini { flex: none; height: 30px; padding: 0 11px; border-radius: 15px; background: #fff; border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; color: var(--berry-ink); white-space: nowrap; }
.mini.on { background: var(--berry); border-color: var(--berry); color: #fff; }
.pose-layer { position: absolute; inset: 0; z-index: 150; }
.ph { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; touch-action: none; display: grid; place-items: center; }
.ph::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--berry); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.25); }
.ph.face::before { background: var(--sky-deep); }
.stage.posing .layer:not(.base):not(.face) { opacity: .4; }
.flow { position: relative; flex: none; height: clamp(118px, 19vh, 170px); touch-action: none; perspective: 900px; overflow: hidden; margin-bottom: 6px; }
.flow .card { position: absolute; left: 50%; top: 50%; height: 82%; aspect-ratio: 1; border-radius: 26px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; will-change: transform; transition: box-shadow .2s; }
.flow .card img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
.flow .card.center { box-shadow: 0 0 0 3px var(--berry), 0 10px 26px rgba(242, 84, 91, .25); }
.flow .card .none { width: 52%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed #E6D5DD; display: grid; place-items: center; color: var(--sub); font-size: 13px; font-weight: 700; }
.flow .card .cap { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 11px; font-weight: 700; color: var(--sub); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity .2s; }
.flow .card.center .cap { opacity: 1; }
.flow .card .tag { position: absolute; top: 8px; left: 10px; font-size: 10px; font-weight: 800; color: var(--sky-deep); letter-spacing: .5px; }
.flow-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.5; }
.flow-empty button { margin-top: 8px; }

/* tabs */
.tabs { display: flex; flex: none; border-top: 1px solid var(--line); background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; font-weight: 700; color: #B3A8BB; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button.on { color: var(--berry); }

/* closet */
.closet { display: flex; flex-direction: column; gap: 16px; }
.closet-intro .btn { flex: none; white-space: nowrap; }
.closet-intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.closet-intro h2 { font-size: 22px; }
.closet-intro p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
.furn { background: var(--wood); border-radius: 26px; padding: 14px 14px 18px; border: 2px solid #F7E4CF; }
.furn-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.furn-head h3 { font-size: 19px; }
.count { font-size: 12px; font-weight: 800; color: var(--berry-ink); background: var(--berry-soft); border-radius: 10px; padding: 2px 8px; }
.furn-head .add { margin-left: auto; height: 32px; padding: 0 12px; border-radius: 16px; background: #fff; font-size: 13px; font-weight: 800; color: var(--berry-ink); box-shadow: 0 2px 0 var(--wood-line); }
.sub-label { font-size: 12px; font-weight: 800; color: #B79A78; margin: 10px 2px 2px; letter-spacing: .3px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 12px; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.rod { height: 9px; border-radius: 5px; background: linear-gradient(#EED6B6, #DDBB93); margin: 6px 2px -4px; }
.cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: center; }
.tile { position: relative; aspect-ratio: 1; border-radius: 18px; background: #fff; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(150, 110, 70, .10); }
.tile img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }
.tile .badge { position: absolute; top: 6px; left: 8px; font-size: 10px; font-weight: 800; color: var(--sky-deep); }
.hang .tile { margin-top: 16px; }
.hang .tile::before { content: ""; position: absolute; top: -17px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border: 3px solid #C9A783; border-bottom: 0; border-radius: 9px 9px 0 0; }
.shelf .tile::after { content: ""; position: absolute; left: -7px; right: -7px; bottom: -9px; height: 6px; border-radius: 3px; background: var(--wood-line); }
.box .grid { background: #fff8; border: 2px dashed #EBD3B7; border-radius: 18px; padding: 12px; }
.cell .nm { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.empty { background: transparent; border: 2px dashed #E6CBAA; box-shadow: none; color: #B79A78; font-size: 12px; font-weight: 800; }

/* settings */
.group { background: var(--card); border-radius: 22px; padding: 4px 16px; box-shadow: var(--shadow); }
.group-title { font-size: 13px; font-weight: 800; color: var(--sub); margin: 18px 6px 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .lbl { font-weight: 600; }
.row .lbl small { display: block; font-weight: 400; color: var(--sub); font-size: 12px; margin-top: 2px; line-height: 1.4; }
.row .go { font-weight: 800; color: var(--berry-ink); font-size: 14px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: #E9E1E7; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .2s; }
.switch input:checked + span { background: var(--berry); }
.switch input:checked + span::after { transform: translateX(20px); }
input[type=range] { accent-color: var(--berry); width: 100%; }
.icon-preview { width: 60px; height: 60px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); flex: none; }
.icon-preview img { width: 100%; height: 100%; object-fit: cover; }
.note { color: var(--sub); font-size: 12.5px; line-height: 1.55; margin: 8px 6px 0; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 54px; width: 100%; border-radius: 17px; background: var(--berry); color: #fff; font-weight: 800; font-size: 16px; }
.btn:active, .chip:active, .tile:active, .round:active { transform: scale(.97); }
.btn.soft { background: var(--berry-soft); color: var(--berry-ink); }
.btn.gray { background: #F2ECEF; color: var(--ink); }
.btn.small { height: 40px; width: auto; padding: 0 16px; font-size: 14px; border-radius: 14px; }
.btn[disabled] { opacity: .45; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* sheets */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(58, 40, 60, .38); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { position: relative; background: var(--milk); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 28px 28px 0 0; padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px)); animation: up .26s cubic-bezier(.2, .9, .3, 1.1); display: flex; flex-direction: column; gap: 14px; }
.sheet.full { height: 94%; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #E4D8DF; margin: 0 auto; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font-size: 21px; }
.sheet-head .x { height: 34px; padding: 0 12px; border-radius: 17px; background: #F2ECEF; font-weight: 700; font-size: 14px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.editor-canvas { position: relative; flex: none; height: 44vh; min-height: 240px; border-radius: 22px; overflow: hidden; touch-action: none;
  background: repeating-conic-gradient(#F3EDF0 0 25%, #fff 0 50%) 0 0 / 22px 22px; }
.editor-canvas canvas { position: absolute; left: 0; top: 0; max-width: none; display: block; transform-origin: 0 0; }
.editor-canvas .fit { position: absolute; right: 10px; bottom: 10px; z-index: 2; height: 34px; }
.editor-canvas.erasing { cursor: crosshair; box-shadow: inset 0 0 0 3px var(--berry); }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.55); font-weight: 800; color: var(--berry-ink); }
.tools { display: flex; align-items: center; gap: 10px; }
.tools label { font-size: 13px; font-weight: 700; color: var(--sub); white-space: nowrap; }
.tool { height: 40px; padding: 0 14px; border-radius: 14px; background: #fff; box-shadow: var(--shadow); font-weight: 800; font-size: 13px; white-space: nowrap; }
.tool.on { background: var(--berry); color: #fff; }
.catpick { display: flex; flex-wrap: wrap; gap: 8px; }
.catpick button { height: 36px; padding: 0 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.catpick button.on { background: var(--berry); border-color: var(--berry); color: #fff; }
.field { width: 100%; height: 50px; border-radius: 15px; border: 1.5px solid var(--line); background: #fff; padding: 0 16px; font: inherit; font-size: 16px; color: var(--ink); box-sizing: border-box; }

.crop-view { position: relative; margin: 0 auto; border-radius: 22px; overflow: hidden; touch-action: none; background: #2a2330; }
.crop-view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; max-width: none; }
.crop-view .mask { position: absolute; inset: 0; pointer-events: none; }
.crop-view .mask.circle { background: radial-gradient(circle closest-side, transparent 0 99%, rgba(30, 20, 35, .55) 100%); }
.crop-view .mask.circle::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px #fff; }
.crop-view .mask.square { box-shadow: inset 0 0 0 3px #fff; border-radius: 22px; }

.pts-view { position: relative; margin: 0 auto; touch-action: none; border-radius: 18px; overflow: hidden; }
.pts-view img { width: 100%; height: 100%; display: block; pointer-events: none; }
.pts-view .guide { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(255,255,255,.85); pointer-events: none; }
.pt { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; display: grid; place-items: center; touch-action: none; }
.pt::before { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--berry); box-shadow: 0 0 0 4px #fff, 0 3px 8px rgba(0,0,0,.3); }
.pt span { position: absolute; left: 40px; white-space: nowrap; background: rgba(58,46,63,.85); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 10px; pointer-events: none; }

.photo-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.photo-item { position: relative; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #eee; box-shadow: var(--shadow); }
.photo-item img.full { width: 100%; height: 100%; object-fit: cover; }
.photo-item img.face { position: absolute; left: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
.photo-item.on { box-shadow: 0 0 0 3px var(--berry); }
.photo-item.add { display: grid; place-items: center; background: #fff; border: 2px dashed var(--line); box-shadow: none; color: var(--berry-ink); font-weight: 800; font-size: 13px; text-align: center; }

.big-item { display: grid; place-items: center; background: #fff; border-radius: 24px; padding: 18px; box-shadow: var(--shadow); }
.big-item img { max-height: 34vh; max-width: 100%; object-fit: contain; }
.result img { width: 100%; border-radius: 22px; box-shadow: var(--shadow); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; pointer-events: auto; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 80; background: rgba(58,46,63,.92); color: #fff; padding: 11px 18px; border-radius: 16px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; max-width: 86%; width: max-content; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="app">
  <header class="top gutter">
    <div class="brand">
      <h1><b>하율</b>이의 옷장</h1>
    </div>
    <div class="head-tools">
    <div class="try-tools" id="tryTools">
      <div class="seg" role="group" aria-label="보기 방식">
          <button id="modeDoll" class="on">인형</button>
          <button id="modePhoto">사진</button>
        </div>
      <button class="round" id="photoBtn" aria-label="하율이 사진 고르기"></button>
      <button class="round" id="saveLookBtn" aria-label="코디 사진으로 저장">
              <svg viewBox="0 0 24 24" fill="none" stroke="#F2545B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            </button>

<script>

/* 착용 순서: z가 클수록 위에 입어요. 양말 → 하의 → 신발 → 상의 → 조끼 → 외투 → 머리띠 → 머리핀 → 모자 */

}

/* ───────────── storage: 공유 옷장(claude db+assets) 또는 이 기기(IndexedDB) ───────────── */
const Local = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('hayul-closet', 2);
        r.onupgradeneeded = () => {
          const d = r.result;
          [['items', 'id'], ['photos', 'id'], ['kv', 'k'], ['looks', 'id']].forEach(([n, k]) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: k }); });
        };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  tx(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try {
        const t = this.db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req ? req.result : null);
        t.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()).then(v => v || []); },
  getKV(k) { return this.tx('kv', 'readonly', st => st.get(k)).then(v => (v ? v.v : null)); },
  put(s, v) { return this.tx(s, 'readwrite', st => st.put(v)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); },
};

const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const byCreated = (a, b) => (a.created || 0) - (b.created || 0);

// 홈 화면 앱(Cloudflare)에서는 /api 서버에 저장해서 두 iPhone이 같은 옷장을 써요
const Api = {
  async req(path, opt = {}) {
    let r;
    try { r = await fetch('/api/' + path, { credentials: 'same-origin', redirect: 'manual', cache: 'no-store', ...opt }); }
    catch (e) { e.net = true; throw e; }
    if (r.type === 'opaqueredirect' || r.status === 401 || r.status === 403) { const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return r.json();
  },
  put(path, data) { const { id, ...rest } = data; return this.req(path, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(rest) }); },
  del(path) { return this.req(path, { method: 'DELETE' }); },
};
// 서버 한 칸에 들어가도록 큰 사진은 줄여요
async function shrinkBlob(blob, max) {
  if (blob.size <= max) return blob;
  const url = URL.createObjectURL(blob); let img;
  try { img = await loadImg(url); } finally { URL.revokeObjectURL(url); }
  let w = img.naturalWidth, h = img.naturalHeight, out = blob;
  for (let i = 0; i < 8 && out.size > max; i++) {
    w = Math.round(w * .85); h = Math.round(h * .85);
    const c = makeCanvas(w, h); c.getContext('2d').drawImage(img, 0, 0, w, h);
    out = await toBlob(c, blob.type === 'image/png' ? 'image/png' : 'image/jpeg', .85);
  }
  return out;
}
let loginShown = false;
function needLogin() {
  if (loginShown) return; loginShown = true;
  const s = openSheet(`<div class="sheet-head"><h2>다시 로그인해 주세요</h2></div><button class="btn" id="relogin">로그인</button>`, { onClose: () => { loginShown = false; } });
  $('#relogin', s.el).onclick = () => location.reload();
}

const Store = {
  mode: 'local', items: [], photos: [], looks: [], adj: {}, subs: new Set(), ready: false, db: null, assets: null, downloads: null,
  on(f) { this.subs.add(f); },
  emit() { this.subs.forEach(f => f()); },
  async init() {
    let db = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        db = await withTimeout(window.claude.use('db'), 12000);
        if (db) {
          this.assets = await withTimeout(window.claude.use('assets'), 8000).catch(() => null);
          this.downloads = await withTimeout(window.claude.use('downloads'), 4000).catch(() => null);
        }
      }
    } catch { db = null; }
    if (db) {
      this.mode = 'cloud'; this.db = db; this.subscribe();
    } else if ((location.protocol === 'https:' || location.hostname === 'localhost') && await this.probeServer()) {
      this.mode = 'server';
      setInterval(() => { if (!document.hidden) this.pull(); }, 20000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); });
    } else {
      this.mode = 'local';
      await Local.open();
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
      const [items, photos, adj, looks] = await Promise.all([Local.all('items'), Local.all('photos'), Local.getKV('adj'), Local.all('looks')]);
      this.items = items.sort(byCreated); this.photos = photos.sort(byCreated); this.adj = adj || {}; this.looks = looks.sort(byCreated);
    }
    this.ready = true; this.emit();
  },
  async probeServer() {
    try { this.applyServer(await Api.req('state')); return true; }
    catch (e) {
      if (e.auth) { this.mode = 'server'; needLogin(); return true; }
      if (e.status && e.status !== 404) { toast('서버 설정을 확인해 주세요'); return true; }
      return false;
    }
  },
  applyServer(st) {
    const key = JSON.stringify([st.items, st.photos, st.adj]); if (key === this.lastState) return false;
    this.lastState = key; this.email = st.email;
    this.items = (st.items || []).sort(byCreated); this.photos = (st.photos || []).sort(byCreated); this.adj = st.adj || {};
    return true;
  },
  async pull() {
    try { if (this.applyServer(await Api.req('state'))) this.emit(); }
    catch (e) { if (e.auth) needLogin(); }
  },
  subscribe() {
    const err = () => toast('공유 옷장 연결이 잠시 끊겼어요. 다시 열어주세요.');
    this.db.collection('items').onSnapshot(s => {
      this.items = s.docs.map(d => { const v = d.data() || {}; return { id: d.id, ...v, src: v.url || ('/_blob/' + v.assetId) }; }).sort(byCreated);
      this.emit();
    }, err);
    this.db.collection('photos').onSnapshot(s => {
      this.photos = s.docs.map(d => { const v = d.data() || {}; return { id: d.id, ...v, full: v.fullUrl, face: v.faceUrl, faceCutSrc: v.faceCutUrl }; }).sort(byCreated);
      this.emit();
    }, err);
    this.db.collection('adj').onSnapshot(s => {
      const a = {}; s.docs.forEach(d => { a[d.id] = d.data() || {}; }); this.adj = a; this.emit();
    }, err);
  },
  canUpload() { return this.mode !== 'cloud' || !!this.assets; },
  async putBlob(blob) {
    if (this.mode === 'local') return { src: await blobToDataURL(blob) };
    if (this.mode === 'server') {
      blob = await shrinkBlob(blob, 1300000); const key = uid();
      await Api.req('blob/' + key, { method: 'PUT', headers: { 'content-type': blob.type || 'image/png' }, body: blob });
      return { src: '/api/blob/' + key, key };
    }
    const r = await this.assets.upload(blob, { type: blob.type });
    return { src: r.url, assetId: r.id };
  },
  async addItem({ blob, cat, name, w, h, id = uid(), created = Date.now() }) {
    const b = await this.putBlob(blob);
    const rec = { cat, name, w, h, created };
    if (this.mode === 'server') {
      const it = { id, ...rec, src: b.src, blobKey: b.key };
      await Api.put('items/' + id, it); this.items.push(it); this.emit(); return it;
    }
    if (this.mode === 'local') {
      const it = { id, ...rec, src: b.src };
      await Local.put('items', it); this.items.push(it); this.emit(); return it;
    }
    await this.db.collection('items').doc(id).set({ ...rec, url: b.src, assetId: b.assetId });
    return { id, ...rec, src: b.src };
  },
  async updateItem(id, patch) {
    if (this.mode === 'server') {
      const it = this.items.find(i => i.id === id); if (!it) return;
      Object.assign(it, patch); await Api.put('items/' + id, it); this.emit(); return;
    }
    if (this.mode === 'local') {
      const it = this.items.find(i => i.id === id); if (!it) return;
      Object.assign(it, patch); await Local.put('items', it); this.emit(); return;
    }
    await this.db.collection('items').doc(id).update(patch);
  },
  async deleteItem(id) {
    const it = this.items.find(i => i.id === id);
    if (this.mode === 'server') { await Api.del('items/' + id); this.items = this.items.filter(i => i.id !== id); this.emit(); return; }
    if (this.mode === 'local') { this.items = this.items.filter(i => i.id !== id); await Local.del('items', id); this.emit(); return; }
    await this.db.collection('items').doc(id).delete();
    if (it && it.assetId && this.assets) this.assets.delete(it.assetId).catch(() => {});
  },
  async addPhoto({ full, face, w, h, id = uid(), created = Date.now(), pts = null }) {
    const [f, c] = [await this.putBlob(full), await this.putBlob(face)];
    const rec = { w, h, pts, created };
    if (this.mode === 'server') {
      const p = { id, ...rec, full: f.src, fullKey: f.key, face: c.src, faceKey: c.key };
      await Api.put('photos/' + id, p); this.photos.push(p); this.emit(); return p;
    }
    if (this.mode === 'local') {
      const p = { id, ...rec, full: f.src, face: c.src };
      await Local.put('photos', p); this.photos.push(p); this.emit(); return p;
    }
    await this.db.collection('photos').doc(id).set({ ...rec, fullUrl: f.src, fullId: f.assetId, faceUrl: c.src, faceId: c.assetId });
    return { id, ...rec, full: f.src, face: c.src };
  },
  async updatePhoto(id, patch) {
    const p = this.photos.find(i => i.id === id);
    if (this.mode === 'server') { if (!p) return; Object.assign(p, patch); await Api.put('photos/' + id, p); this.emit(); return; }
    if (this.mode === 'local') { if (!p) return; Object.assign(p, patch); await Local.put('photos', p); this.emit(); return; }
    if (p) Object.assign(p, patch);
    await this.db.collection('photos').doc(id).update(patch);
  },
  async deletePhoto(id) {
    const p = this.photos.find(i => i.id === id);
    if (this.mode === 'server') { await Api.del('photos/' + id); this.photos = this.photos.filter(i => i.id !== id); this.emit(); return; }
    if (this.mode === 'local') { this.photos = this.photos.filter(i => i.id !== id); await Local.del('photos', id); this.emit(); return; }
    await this.db.collection('photos').doc(id).delete();
    if (p && this.assets) { p.fullId && this.assets.delete(p.fullId).catch(() => {}); p.faceId && this.assets.delete(p.faceId).catch(() => {}); }
  },
  async addLook(look) { this.looks.push(look); await Local.put('looks', look); },
  async deleteLook(id) { this.looks = this.looks.filter(l => l.id !== id); await Local.del('looks', id); },
  getAdj(base, itemId) { return (this.adj[base] || {})[itemId] || null; },
  async setAdj(base, itemId, val) {
    const m = { ...(this.adj[base] || {}) };
    if (val) m[itemId] = val; else delete m[itemId];
    this.adj[base] = m;
    if (this.mode === 'server') await Api.put('adj/' + base, m).catch(() => toast('위치를 저장하지 못했어요'));
    else if (this.mode === 'local') await Local.put('kv', { k: 'adj', v: this.adj });
    else await this.db.doc('adj/' + base).set(m).catch(() => toast('위치를 저장하지 못했어요'));
  },
};

/* ───────────── 그림 도구: 인형, 기본 얼굴, 예시 옷 ───────────── */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function trimCanvas(c, pad = 3) {
  const ctx = c.getContext('2d'); const { width: W, height: H } = c; const d = ctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return c;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const o = makeCanvas(x1 - x0 + 1, y1 - y0 + 1); o.getContext('2d').drawImage(c, -x0, -y0); return o;
}

  const c = makeCanvas(w, h); const ctx = c.getContext('2d'); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; draw(ctx);
  const t = trimCanvas(c); return { src: t.toDataURL('image/png'), w: t.width, h: t.height };
}
function strawberry(c, x, y, s) {

  c.fillStyle = '#EE4A55'; c.beginPath(); c.moveTo(0, 14); c.bezierCurveTo(-16, 4, -14, -12, 0, -9); c.bezierCurveTo(14, -12, 16, 4, 0, 14); c.fill();
  c.fillStyle = '#4FAE5E'; c.beginPath(); c.ellipse(-4, -10, 6, 3, -.5, 0, 7); c.ellipse(4, -10, 6, 3, .5, 0, 7); c.fill();

  c.restore();
}
function milkBox(c, x, y, s, r) {

  c.fillStyle = '#E8474F'; c.fillRect(-14, -10, 28, 30); c.beginPath(); c.moveTo(-14, -10); c.lineTo(0, -22); c.lineTo(14, -10); c.fill();
  c.fillStyle = '#fff'; c.fillRect(-10, 0, 20, 7); c.fillStyle = '#FFE58F'; c.beginPath(); c.arc(0, 13, 4.5, 0, 7); c.fill();
  c.restore();
}
function flower(c, x, y, r, petal = '#fff', mid = '#FFD25E') {
  c.fillStyle = petal; for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; c.beginPath(); c.arc(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9, r * .75, 0, 7); c.fill(); }

}
function teePath(c, hem = 480) {
  c.beginPath(); c.moveTo(225, 40); c.quadraticCurveTo(300, 95, 375, 40); c.lineTo(455, 62); c.lineTo(585, 300); c.lineTo(535, 328); c.lineTo(432, 175);

}
function drawTee(c, { body, line, rib, hem = 480, pattern }) {
  teePath(c, hem); c.fillStyle = body; c.fill();
  if (pattern) { c.save(); teePath(c, hem); c.clip(); pattern(c); c.restore(); }
  c.lineWidth = 13; c.strokeStyle = rib;

    else g = { two: false, sx: a[0].x, sy: a[0].y, x: view.x, y: view.y };
  };
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    try { wrap.setPointerCapture(e.pointerId); } catch {}
    P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (P.size === 2 && stroke) { edits = undo.pop() || edits; stroke = false; draw(); }
    if (P.size === 1 && tool !== 'move') { undo.push(edits.slice()); if (undo.length > 12) undo.shift(); stroke = true; paint(e.clientX, e.clientY); }
    startGesture();
  });
  wrap.addEventListener('pointermove', e => {
    if (!P.has(e.pointerId)) return; P.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const a = [...P.values()];
    if (g && g.two && a.length >= 2) {
      const r = wrap.getBoundingClientRect(); const d = Math.hypot(a[1].x - a[0].x, a[1].y - a[0].y);
      const cx = (a[0].x + a[1].x) / 2 - r.left, cy = (a[0].y + a[1].y) / 2 - r.top;
      const z = clamp(g.z * d / g.d, 1, 24), k = z / g.z;
      view.z = z; view.x = cx - (g.cx - g.x) * k; view.y = cy - (g.cy - g.y) * k; applyView();
    } else if (stroke) paint(e.clientX, e.clientY);
    else if (g && !g.two && view.z > 1) { view.x = g.x + e.clientX - g.sx; view.y = g.y + e.clientY - g.sy; applyView(); }
  });
  const up = e => { if (!P.has(e.pointerId)) return; P.delete(e.pointerId); stroke = false; if (P.size) startGesture(); else g = null; };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);

  $('#saveItem', s.el).onclick = async e => {
    const btn = e.currentTarget; if (btn.disabled) return;
    // 가장자리를 살짝 부드럽게 (3x3 평균)
    const a = new Uint8ClampedArray(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue; sum += alphaAt(yy * W + xx) ? 255 : 0; n++; }
      a[y * W + x] = sum / n;
    }
    if (!a.some(v => v > 0)) { toast('옷이 모두 지워졌어요. 배경 지우기를 낮추거나 살리기로 칠해주세요'); return; }
    const full = makeCanvas(W, H); const fctx = full.getContext('2d'); const id = fctx.createImageData(W, H);
    for (let i = 0, j = 0; i < W * H; i++, j += 4) { id.data[j] = data.data[j]; id.data[j + 1] = data.data[j + 1]; id.data[j + 2] = data.data[j + 2]; id.data[j + 3] = a[i]; }
    fctx.putImageData(id, 0, 0);

    try {

      prefs.outfit[cat] = it.id; prefs.cat = cat; savePrefs();

      refreshAll();

    }
  };
}

/* 사진을 움직여 동그라미/네모에 맞추기 */
function openCropper(img, { shape = 'circle', title = '맞추기', out = 512 } = {}) {
  return new Promise(resolve => {
    let done = false;
    const s = openSheet(`
      <div class="sheet-head"><button class="x" data-close>취소</button><h2>${esc(title)}</h2><span style="width:52px"></span></div>
      <div class="crop-view" id="cv"><img id="cimg" alt=""><div class="mask ${shape}"></div></div>
      <div class="tools"><label for="zm">크기</label><input type="range" id="zm" min="100" max="700" value="100"></div>
      <button class="btn" id="cok">이대로 할게요</button>`, { onClose: () => { if (!done) resolve(null); } });
    const view = $('#cv', s.el), im = $('#cimg', s.el);
    const V = Math.min(s.el.clientWidth - 32, 360); view.style.width = view.style.height = V + 'px';
    im.src = img.src; const iw = img.naturalWidth, ih = img.naturalHeight;
    const cover = Math.max(V / iw, V / ih);
    // 얼굴은 보통 사진 위쪽 1/3쯤에 있어요
    const s0 = shape === 'circle' ? cover * 2.2 : cover, fy = shape === 'circle' ? .28 : .5;
    let st = { s: s0, x: V / 2 - iw * .5 * s0, y: clamp(V / 2 - ih * fy * s0, V - ih * s0, 0) }, b = null;
    const apply = () => { im.style.width = iw + 'px'; im.style.height = ih + 'px'; im.style.transform = `translate(${st.x}px, ${st.y}px) scale(${st.s})`; $('#zm', s.el).value = Math.round(st.s / cover * 100); };
    const zoomAt = (ns, px, py) => { ns = clamp(ns, cover, cover * 7); st.x = px - (px - st.x) * ns / st.s; st.y = py - (py - st.y) * ns / st.s; st.s = ns; };
    apply();
    gestures(view, {
      begin(base) { const r = view.getBoundingClientRect(); b = { ...st, px: base.cx - r.left, py: base.cy - r.top }; },
      move(d) { st = { ...b }; zoomAt(b.s * d.s, b.px, b.py); st.x += d.dx; st.y += d.dy; apply(); },
    });
    $('#zm', s.el).oninput = e => { zoomAt(cover * e.target.value / 100, V / 2, V / 2); apply(); };
    $('#cok', s.el).onclick = async () => {
      const c = makeCanvas(out, out); const x = c.getContext('2d'); const k = out / V;
      x.fillStyle = '#FFF0F2'; x.fillRect(0, 0, out, out);
      x.drawImage(img, st.x * k, st.y * k, iw * st.s * k, ih * st.s * k);
      const blob = await toBlob(c, 'image/png'); done = true; closeSheet(s); resolve(blob);
    };
  });
}

async function saveLook() {
  const info = stageInfo(); const scene = buildScene(info); const W = 1080, k = W / SW, H = Math.round(SH * k);
  const c = makeCanvas(W, H); const x = c.getContext('2d');
  try {
    if (info.kind === 'doll') {
      const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#D7F0FB'); g.addColorStop(1, '#BFE1F2'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = 'rgba(60,120,160,.16)'; x.beginPath(); x.ellipse(W / 2, H * .95, W * .28, H * .022, 0, 0, 7); x.fill();
      const dc = makeCanvas(W, H); const dx = dc.getContext('2d'); dx.setTransform(W / DOLL.W, 0, 0, H / DOLL.H, 0, 0); drawDoll(dx, pose(), scene.doll); x.drawImage(dc, 0, 0);
      const f = { ...faceC(), r: faceR() }, kk = W / DOLL.W; const fi = await loadImg(faceSrc(info.ph)); const D = Math.round(2 * f.r * kk);
      const fc = makeCanvas(D, D); const fx = fc.getContext('2d'); fx.drawImage(fi, 0, 0, D, D);
      if (!(info.ph && info.ph.faceCut)) { // 무대와 같은 부드러운 가장자리
        const g2 = fx.createRadialGradient(D / 2, D / 2, 0, D / 2, D / 2, D / 2); g2.addColorStop(.82, '#000'); g2.addColorStop(1, 'rgba(0,0,0,0)');
        fx.globalCompositeOperation = 'destination-in'; fx.fillStyle = g2; fx.fillRect(0, 0, D, D);
      }
      x.drawImage(fc, (f.x - f.r) * kk, (f.y - f.r) * kk);
    } else x.drawImage(await loadImg(info.ph.full), 0, 0, W, H);
    const draws = scene.ops.slice();
    for (const o of draws.sort((a, b) => a.z - b.z)) {
      const im = await loadImg(o.src);
      x.save(); x.translate((o.x + o.w / 2) * k, (o.y + o.h / 2) * k); x.rotate(o.r * Math.PI / 180); x.scale(o.s, o.s);
      if (o.clip) { x.beginPath(); x.rect(-o.w * k / 2 + o.clip.u0 * o.w * k, -o.h * k / 2, (o.clip.u1 - o.clip.u0) * o.w * k, o.h * k); x.clip(); }
      x.drawImage(im, -o.w * k / 2, -o.h * k / 2, o.w * k, o.h * k); x.restore();
    }
    x.font = '700 30px "Jua", sans-serif'; x.fillStyle = 'rgba(58,46,63,.55)'; x.textAlign = 'right';
    const d = new Date(); x.fillText(`하율이의 옷장 · ${d.getMonth() + 1}월 ${d.getDate()}일`, W - 30, H - 28);
  } catch { toast('사진을 만들지 못했어요'); return; }
  let blob; try { blob = await toBlob(c, 'image/jpeg', .92); } catch { blob = null; }
  if (!blob) { toast('사진을 만들지 못했어요'); return; }
  const url = URL.createObjectURL(blob);
  const fname = `하율이코디-${Date.now()}.jpg`;
  const s = openSheet(`<div class="sheet-head"><h2>오늘의 코디</h2><button class="x" data-close>닫기</button></div>
    <div class="result"><img src="${url}" alt="오늘의 코디"></div>
    <button class="btn" id="shareLook">저장하기</button>`, { onClose: () => URL.revokeObjectURL(url) });
  Sound.pop();
  $('#shareLook', s.el).onclick = async () => {
    try {
      const file = new File([blob], fname, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '하율이 코디' }); return; }
      if (Store.downloads) { await Store.downloads.save({ filename: fname, data: blob }); toast('저장했어요'); return; }
      const a = document.createElement('a'); a.href = url; a.download = fname; a.click();
    } catch (e) { if (!e || e.name !== 'AbortError') toast('사진을 길게 눌러서 저장해주세요'); }
  };
}

/* ───────────── 소리: 16비트 느낌 자장가 (직접 만든 곡) ───────────── */
const NOTE = n => { const m = n.match(/^([A-G])(b|#)?(\d)$/); const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]]; return 12 * (+m[3] + 1) + base + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const SONG = (() => {
  const mel = [
    ['A4', 1], ['C5', 1], ['A4', .5], ['G4', .5], ['F4', 1],
    ['D5', 1], ['C5', .5], ['A4', .5], ['F4', 1.5], [null, .5],
    ['D5', 1], ['F5', .5], ['D5', .5], ['C5', 1], ['Bb4', 1],
    ['A4', .5], ['Bb4', .5], ['C5', 1], ['G4', 2],
    ['A4', 1], ['C5', 1], ['F5', 1], ['E5', .5], ['D5', .5],
    ['C5', 1], ['A4', .5], ['C5', .5], ['E5', 2],
    ['D5', .5], ['C5', .5], ['Bb4', .5], ['D5', .5], ['C5', 1], ['A4', 1],
    ['G4', 1], ['A4', .5], ['G4', .5], ['F4', 2],
  ];
  const CH = { F: [65, 69, 72], Dm: [62, 65, 69], Bb: [58, 62, 65], C: [60, 64, 67], Am: [57, 60, 64] };
  const prog = ['F', 'Dm', 'Bb', 'C', 'F', 'Am', 'Bb', 'C'];
  const ev = []; let t = 0;
  mel.forEach(([n, d]) => { if (n) ev.push({ t, d, m: NOTE(n), v: 'lead' }); t += d; });
  prog.forEach((name, bar) => {
    const ch = CH[name], b0 = bar * 4;
    ev.push({ t: b0, d: 1, m: ch[0] - 24, v: 'bass' }, { t: b0 + 2, d: 1, m: ch[0] - 17, v: 'bass' });
    [0, 1, 2, 1, 0, 1, 2, 1].forEach((ix, i) => ev.push({ t: b0 + i * .5, d: .5, m: ch[ix] + 12, v: 'bell' }));
  });
  return { ev: ev.sort((a, b) => a.t - b.t), len: 32, bpm: 84 };
})();
const Sound = {

const APP_URL = ''; // 홈 화면 앱 주소 (Cloudflare 배포 후 채워요)
const FAL = {
  KEY: 'hayul-closet.falKey', base: 'https://queue.fal.run', model: 'fal-ai/fashn/tryon/v1.6',
  key() { try { return localStorage.getItem(this.KEY) || ''; } catch { return ''; } },
  setKey(k) { try { localStorage.setItem(this.KEY, k); } catch {} },
  async err(r) { let t = ''; try { t = await r.text(); } catch {} const e = new Error(t || r.statusText); e.status = r.status; return e; },
  async run(input, onStatus, model = this.model) {

    if (!r.ok) throw await this.err(r);

    for (let i = 0; ; i++) {

      const st = await s.json(); onStatus && onStatus(st.status, st.queue_position);
      if (st.status === 'COMPLETED') break;

      const d = JSON.parse(await f.text()); if (d.app !== 'hayul-closet' && d.app !== 'haryul-closet') throw 0;
      if (Store.mode === 'server') {
        toast('옷장으로 옮기는 중이에요…');
        const blobOf = async src => (await fetch(src)).blob();
        for (const it of d.items || []) if (!Store.items.some(x => x.id === it.id)) await Store.addItem({ ...it, blob: await blobOf(it.src) });
        for (const p of d.photos || []) {
          if (Store.photos.some(x => x.id === p.id)) continue;
          await Store.addPhoto({ ...p, full: await blobOf(p.full), face: await blobOf(p.face) });
          if (p.faceCutSrc) { const b = await Store.putBlob(await blobOf(p.faceCutSrc)); await Store.updatePhoto(p.id, { faceCutSrc: b.src, faceCutKey: b.key, faceCut: !!p.faceCut }); }
        }
        for (const [base, m] of Object.entries(d.adj || {})) { Store.adj[base] = { ...m, ...(Store.adj[base] || {}) }; await Api.put('adj/' + base, Store.adj[base]); }
        Store.emit(); toast('백업을 불러왔어요'); return;
      }
      for (const it of d.items || []) { if (!Store.items.some(x => x.id === it.id)) { await Local.put('items', it); Store.items.push(it); } }
      for (const p of d.photos || []) { if (!Store.photos.some(x => x.id === p.id)) { await Local.put('photos', p); Store.photos.push(p); } }
      for (const l of d.looks || []) { if (!Store.looks.some(x => x.id === l.id)) await Store.addLook(l); }
      Store.adj = Object.assign({}, d.adj || {}, Store.adj); await Local.put('kv', { k: 'adj', v: Store.adj });
      Store.items.sort(byCreated); Store.photos.sort(byCreated); Store.emit(); toast('백업을 불러왔어요');
    } catch { toast('하율이의 옷장 백업 파일이 아니에요'); }
  };
  inp.click();
}
